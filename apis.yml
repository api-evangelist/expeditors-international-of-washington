apis:
  - aid: expeditors-international-of-washington-tracking
    name: Expeditors Tracking API
    description: >-
      Read-only REST/JSON API that lets a contracted Expeditors customer pull
      real-time shipment, container, order-management container, consignment
      and cross-dock tracking data into its own enterprise and reporting
      systems — including status, milestone events, trace references and
      document images. Same source data as the EXP.O NOW visibility
      application; active shipments plus those completed in the last 120 days.
      Authentication is OAuth 2.0 client credentials returning a bearer token.
    humanURL: https://help.expeditors.com/globalhelp/shipment_api/home.htm
