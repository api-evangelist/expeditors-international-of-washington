aid: expeditors-international-of-washington
name: Expeditors International of Washington
description: >-
  Expeditors International of Washington is a Fortune 500 global logistics
  company providing air and ocean freight forwarding, customs brokerage and
  trade compliance, order management, warehousing and distribution, and
  supply-chain consulting through a company-owned network of branches. Its
  technology arm publishes the EXP.O NOW visibility platform and a public
  Expeditors Tracking API (v2) documented at its API Developer Center — a
  read-only REST/JSON service over shipments, containers, order-management
  containers, consignments and cross-dock movements, their events, references
  and documents. Access is OAuth 2.0 client-credentials with bearer tokens and
  a default limit of 2,000 requests per hour; credentials are issued by an
  Expeditors representative rather than through self-service sign-up. Bulk
  integration is also delivered through traditional EDI and other B2B
  protocols.
