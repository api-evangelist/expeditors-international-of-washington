entities:
  - name: AccessToken
    description: Bearer token minted by the client-credentials grant.
    fields: [access_token, token_type, expires_in, scope]
  - name: Shipment
    id_field: id
    id_format: String, 3 to 12 characters
    description: A freight shipment handled by Expeditors. Root resource of the tracking surface.
    fields:
      - id
      - status
      - lastUpdateTime
      - origin
      - destination
      - delivery
      - loading
      - unlading
      - clearance
      - mode
      - vessel
      - voyageFlight
      - freightTerms
      - serviceType
      - quantity
      - weight
      - volume
      - carrier
      - consignee
      - shipper
      - actualReceiptTimes
      - requestedDeliveryTime
      - goodsDesc
      - hazardous
      - securityFilingParty
  - name: ShipmentSummary
    description: Projection of Shipment carrying id, status, lastUpdateTime, origin and destination.
    fields: [id, status, lastUpdateTime, origin, destination]
  - name: Count
    description: Total number of resources matching a query.
    fields: [count]
  - name: AddressInformation
    description: Shipper and consignee party addresses for a shipment.
    fields: [shipper, consignee]
    subfields: [name, address1, address2, city, state, zip, countryCode]
  - name: ExpeditorsBranchReference
    description: An Expeditors branch office acting as origin, destination, loading, unlading, delivery or clearance point.
    fields: [name, code]
  - name: Measure
    description: A quantity, weight or volume value with its unit of measure.
    fields: [value, unit]
  - name: Event
    description: A dated milestone on a shipment, container or consignment.
    fields: [description, time, origin, destination, remarks, invoice, code]
  - name: Reference
    description: A trace reference (customer PO, booking, bill of lading and similar) attached to a shipment.
    fields: [refType, refNumber]
  - name: Document
    description: A document image attached to a shipment or consignment, downloadable by callback URL or as Base64.
    fields: [documentType, group, label, fileSize, numberOfPages, downloadCallbackURL, Base64EncodedDocument]
  - name: Container
    description: A physical container tracked by Expeditors, with its own events and line items.
  - name: ContainerSummary
    description: Summary projection of Container.
  - name: OMContainer
    description: An order-management container, with its own events and items.
  - name: Consignment
    description: A consignment or cross-dock movement, with events, references and documents.
  - name: ConsignmentSummary
    description: Summary projection of Consignment.
